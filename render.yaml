services:
  - type: web
    name: fire-sync
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "cd \"Recreate Dark Enterprise Dashboard\" && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.10.0
      - key: ENVIRONMENT
        value: production
